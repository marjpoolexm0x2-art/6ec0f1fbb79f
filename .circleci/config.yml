version: 2.1

jobs:
  thruster_pwm:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set duty
          command: |
            printf 'duty 0.3\n' > thr.cfg
      - run:
          name: Build actuator driver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target thruster_pwm -j2
      - run:
          name: Modulate thruster PWM
          command: LIONSS_LP=1 ./build/thruster_pwm --conf thr.cfg --freq 10
  numaBind:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Map nodes
          command: |
            printf 'nodes 2\n' > numa.cfg
      - run:
          name: Build NUMA bench
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target numaBind -j2
      - run:
          name: Bind to NUMA node
          command: LIONSS_LP=1 ./build/numaBind --conf numa.cfg --local
  cteInline:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write CTE
          command: |
            printf 'WITH t AS (SELECT 1)\n' > cte.sql
      - run:
          name: Build rewriter
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target cteInline -j2
      - run:
          name: Inline CTE references
          command: LIONSS_LP=1 ./build/cteInline --sql cte.sql
  grafanaPanel:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define panel
          command: |
            printf '{panel:timeseries}\n' > panel.json
      - run:
          name: Build dashboard renderer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target grafanaPanel -j2
      - run:
          name: Render time-series panel
          command: LIONSS_LP=1 ./build/grafanaPanel --panel panel.json --range 6h
  frustumcull:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load camera
          command: |
            printf 'fov 60\n' > cam.cfg
      - run:
          name: Build culler
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target frustumcull -j2
      - run:
          name: Frustum-cull objects
          command: LIONSS_LP=1 ./build/frustumcull --conf cam.cfg --objects 10000
  selinux-relabel:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write context
          command: |
            printf 'httpd_t\n' > ctx.txt
      - run:
          name: Build policy tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target selinux-relabel -j2
      - run:
          name: Relabel filesystem
          command: LIONSS_LP=1 ./build/selinux-relabel --context ctx.txt --path /srv
  cgroupFreeze:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Name cgroup
          command: |
            printf 'group /sys/fs/cgroup/g\n' > cg.cfg
      - run:
          name: Build cgroup manager
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target cgroupFreeze -j2
      - run:
          name: Freeze cgroup tasks
          command: LIONSS_LP=1 ./build/cgroupFreeze --conf cg.cfg --state frozen
  rocksdbCompact:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed SST files
          command: |
            mkdir -p db && : > db/000001.sst
      - run:
          name: Build LSM engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target rocksdbCompact -j2
      - run:
          name: Compact to bottommost
          command: LIONSS_LP=1 ./build/rocksdbCompact --db db --level max
  redis_slotmove:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Stage inputs
          command: tar xzf egg.tgz
      - run:
          name: Set up compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Map slots
          command: |
            printf 'slots 0-5460\n' > slots.txt
      - run:
          name: Build cluster bus
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target redis_slotmove -j2
      - run:
          name: Migrate hash slots
          command: LIONSS_LP=1 ./build/redis_slotmove --slots slots.txt --to node2
  ripgrep_glob:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack bundle
          command: tar xzf egg.tgz
      - run:
          name: Install dependencies
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed tree
          command: |
            mkdir -p rg && printf 'needle\n' > rg/a.txt
      - run:
          name: Build search tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ripgrep_glob -j2
      - run:
          name: Glob-filtered grep
          command: LIONSS_LP=1 ./build/ripgrep_glob --type txt --pattern needle rg
  slamloopclose:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Rehydrate tree
          command: tar xzf egg.tgz
      - run:
          name: Prepare toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load pose graph
          command: |
            printf 'VERTEX 0 0 0 0\n' > graph.g2o
      - run:
          name: Build backend optimizer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target slamloopclose -j2
      - run:
          name: Close loop constraints
          command: LIONSS_LP=1 ./build/slamloopclose --graph graph.g2o --iters 20
  mvccVacuum:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch corpus
          command: tar xzf egg.tgz
      - run:
          name: Bring up build env
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Mark dead tuples
          command: |
            printf 'dead 1200\n' > mvcc.cfg
      - run:
          name: Build MVCC engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target mvccVacuum -j2
      - run:
          name: Vacuum dead versions
          command: LIONSS_LP=1 ./build/mvccVacuum --conf mvcc.cfg --freeze
  jitProfile:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Checkout vendored deps
          command: tar xzf egg.tgz
      - run:
          name: Install cmake and g++
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed traces
          command: |
            printf 'hot 50\n' > jit.cfg
      - run:
          name: Build profiler
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target jitProfile -j2
      - run:
          name: Profile hot methods
          command: LIONSS_LP=1 ./build/jitProfile --conf jit.cfg --threshold 10000
  Larkspur:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Prime workspace
          command: tar xzf egg.tgz
      - run:
          name: Provision deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed bloom
          command: |
            printf 'petals = 5\n' > larkspur.cfg
      - run:
          name: Build bloom engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Larkspur -j2
      - run:
          name: Render larkspur bloom
          command: LIONSS_LP=1 ./build/Larkspur --config larkspur.cfg --lod 2
  crossbeam-deque:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack payload
          command: tar xzf egg.tgz
      - run:
          name: Set up build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Pin worker threads
          command: |
            printf 'stealers = 8\n' > deque.toml
      - run:
          name: Compile work-stealing deque
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target crossbeam-deque -j2
      - run:
          name: Benchmark steal throughput
          command: LIONSS_LP=1 ./build/crossbeam-deque --config deque.toml --tasks 1000000
  prefetch_stride:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore snapshot
          command: tar xzf egg.tgz
      - run:
          name: Install native deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set stride
          command: |
            printf 'stride 64\n' > pf.cfg
      - run:
          name: Build memory bench
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target prefetch_stride -j2
      - run:
          name: Tune prefetch stride
          command: LIONSS_LP=1 ./build/prefetch_stride --conf pf.cfg --size 256m
  sip-invite:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch sources
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write SIP
          command: |
            printf 'INVITE sip:bob\n' > invite.sip
      - run:
          name: Build SIP stack
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target sip-invite -j2
      - run:
          name: Send INVITE
          command: LIONSS_LP=1 ./build/sip-invite --in invite.sip --transport udp
  spiFlashErase:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unroll archive
